<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化交易系统 · 数据看板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d1117'/><path d='M20 70 L40 45 L55 60 L80 25' stroke='%2300d4aa' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ===== 全局 ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0f19;--bg2:#111627;--card:#161b2e;--card2:#1c2238;
  --border:#252b45;--text:#e4e8f0;--text2:#8b93a7;--text3:#5c6478;
  --up:#00d4aa;--down:#ff4d6a;--gold:#f0b90b;--blue:#4da6ff;--purple:#a78bfa;
}
html{font-size:14px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(0,212,170,.06) 0%,transparent 50%),
                   radial-gradient(ellipse at 80% 100%,rgba(77,166,255,.05) 0%,transparent 50%);
}
.num{font-family:"SF Mono","Monaco","Consolas","Courier New",monospace;font-variant-numeric:tabular-nums}

/* ===== 顶部 ===== */
.header{
  padding:20px 32px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  background:linear-gradient(180deg,rgba(22,27,46,.9),rgba(11,15,25,.9));
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;
}
.header-left{display:flex;align-items:center;gap:14px}
.logo{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,#00d4aa,#0891b2);
  display:flex;align-items:center;justify-content:center;
}
.logo svg{width:22px;height:22px}
.header h1{font-size:1.25rem;font-weight:700;letter-spacing:.5px}
.header h1 span{color:var(--up)}
.subtitle{font-size:.78rem;color:var(--text3);margin-top:2px}
.header-right{display:flex;gap:20px;align-items:center}
.badge{
  padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600;
  border:1px solid var(--border);background:var(--card);
}
.badge.live{color:var(--up);border-color:rgba(0,212,170,.3)}
.badge.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== 容器 ===== */
.container{max-width:1440px;margin:0 auto;padding:24px 32px 48px}

/* ===== 切换标签 ===== */
.tab-bar{display:flex;gap:4px;margin-bottom:20px;background:var(--card);padding:4px;border-radius:10px;width:fit-content}
.tab-btn{
  padding:8px 20px;border:none;background:transparent;color:var(--text2);
  font-size:.85rem;font-weight:600;border-radius:7px;cursor:pointer;transition:all .2s;
}
.tab-btn.active{background:var(--card2);color:var(--up);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tab-btn:hover:not(.active){color:var(--text)}

/* ===== KPI 卡片 ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:24px}
.kpi-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;position:relative;overflow:hidden;transition:border-color .2s;
}
.kpi-card:hover{border-color:var(--text3)}
.kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--card2)}
.kpi-card.up::before{background:linear-gradient(90deg,var(--up),transparent)}
.kpi-card.down::before{background:linear-gradient(90deg,var(--down),transparent)}
.kpi-label{font-size:.75rem;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.kpi-value{font-size:1.4rem;font-weight:700;margin-bottom:4px}
.kpi-value.pos{color:var(--up)}
.kpi-value.neg{color:var(--down)}
.kpi-compare{font-size:.72rem;color:var(--text3);display:flex;gap:8px}
.kpi-compare span{display:inline-flex;align-items:center;gap:3px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.red{background:var(--down)}
.dot.blue{background:var(--blue)}

/* ===== 图表区 ===== */
.chart-row{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}
.chart-row.two{grid-template-columns:1fr 1fr}
.chart-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;
}
.chart-title{
  font-size:.9rem;font-weight:600;margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between;
}
.chart-title .tag{font-size:.7rem;color:var(--text3);font-weight:400}
.chart-box{width:100%;height:340px}
.chart-box.tall{height:420px}

/* ===== 表格 ===== */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.82rem}
th{
  text-align:left;padding:10px 12px;color:var(--text3);font-weight:600;
  font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--border);background:var(--card2);
}
td{padding:10px 12px;border-bottom:1px solid rgba(37,43,69,.5);color:var(--text)}
tr:hover td{background:rgba(255,255,255,.02)}
.col-action{width:70px}
.col-price{width:90px}
.col-shares{width:80px}
.col-pnl{width:100px}
.col-reason{width:140px}
.col-date{width:110px}
.tag-buy{color:var(--up);font-weight:600}
.tag-sell{color:var(--down);font-weight:600}
.pnl-pos{color:var(--up)}
.pnl-neg{color:var(--down)}

/* ===== 对比表 ===== */
.compare-table th:first-child{width:30%}
.compare-table th,.compare-table td{text-align:center}
.compare-table td:first-child{text-align:left;font-weight:600;color:var(--text2)}
.compare-table .better{color:var(--up);font-weight:700}

/* ===== 底部 ===== */
.footer{
  text-align:center;padding:24px;color:var(--text3);font-size:.75rem;
  border-top:1px solid var(--border);margin-top:32px;
}

/* ===== 响应式 ===== */
@media(max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .chart-row.two{grid-template-columns:1fr}
}
@media(max-width:640px){
  .container{padding:16px}
  .header{padding:14px 16px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-value{font-size:1.1rem}
  .chart-box{height:280px}
}
</style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<header class="header">
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 4 7-9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>量化交易系统 <span>·</span> 数据看板</h1>
      <div class="subtitle" id="headerInfo">加载中...</div>
    </div>
  </div>
  <div class="header-right">
    <span class="badge live">回测模式</span>
    <span class="badge">双均线 MA5/MA20</span>
  </div>
</header>

<div class="container">

  <!-- ===== 模式切换 ===== -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchMode('compare')">绩效对比</button>
    <button class="tab-btn" onclick="switchMode('no_jev')">无Jev过滤</button>
    <button class="tab-btn" onclick="switchMode('with_jev')">有Jev过滤</button>
  </div>

  <!-- ===== KPI 卡片 ===== -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- ===== 净值曲线 ===== -->
  <div class="chart-card">
    <div class="chart-title">
      净值曲线对比 <span class="tag">初始资金归一化为 100</span>
    </div>
    <div class="chart-box tall" id="equityChart"></div>
  </div>

  <!-- ===== 回撤 + K线 ===== -->
  <div class="chart-row two">
    <div class="chart-card">
      <div class="chart-title">回撤曲线 <span class="tag">百分比</span></div>
      <div class="chart-box" id="drawdownChart"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">K线与买卖点 <span class="tag" id="klineTag">无Jev过滤</span></div>
      <div class="chart-box" id="klineChart"></div>
    </div>
  </div>

  <!-- ===== 绩效对比表 ===== -->
  <div class="table-card">
    <div class="chart-title">绩效指标对比</div>
    <div class="table-scroll">
      <table class="compare-table" id="compareTable">
        <colgroup><col style="width:25%"><col style="width:37.5%"><col style="width:37.5%"></colgroup>
        <thead><tr><th>指标</th><th>无Jev过滤</th><th>有Jev过滤</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- ===== 交易明细 ===== -->
  <div class="table-card">
    <div class="chart-title">
      交易明细 <span class="tag" id="tradeTag">全部交易</span>
    </div>
    <div class="table-scroll">
      <table id="tradeTable">
        <colgroup>
          <col class="col-date"><col style="width:90px"><col class="col-action">
          <col class="col-price"><col class="col-shares"><col style="width:100px">
          <col class="col-pnl"><col class="col-reason">
        </colgroup>
        <thead>
          <tr><th>日期</th><th>模式</th><th>方向</th><th>价格</th><th>数量</th><th>金额</th><th>盈亏</th><th>原因</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<footer class="footer">
  量化交易系统 · 数据仅供研究参考，不构成投资建议 · 回测结果不代表未来表现
</footer>

function renderKPI(){
  const mNo = DATA.metrics.no_jev;
  const mYes = DATA.metrics.with_jev;
  const items = [
    {label:'累计收益率',no:mNo['累计收益率'],yes:mYes['累计收益率'],fmt:fmtPct,pct:true},
    {label:'年化收益率',no:mNo['年化收益率'],yes:mYes['年化收益率'],fmt:fmtPct,pct:true},
    {label:'最大回撤',no:mNo['最大回撤'],yes:mYes['最大回撤'],fmt:fmtPct,pct:true,lower:true},
    {label:'夏普比率',no:mNo['夏普比率'],yes:mYes['夏普比率'],fmt:v=>v.toFixed(3)},
    {label:'胜率',no:mNo['胜率'],yes:mYes['胜率'],fmt:fmtPct,pct:true},
    {label:'交易次数',no:mNo['交易次数'],yes:mYes['交易次数'],fmt:v=>Math.round(v)},
  ];
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = items.map(it=>{
    const better = it.lower ? (it.no < it.yes ? 'no' : 'yes') : (it.no > it.yes ? 'no' : 'yes');
    const val = currentMode==='no_jev'?it.no:currentMode==='with_jev'?it.yes:(better==='no'?it.no:it.yes);
    let cls = it.pct ? (val>0?'pos':val<0?'neg':'') : (val>=0?'pos':'neg');
    if(it.label==='最大回撤') cls='neg';
    return '<div class="kpi-card '+(cls==='pos'?'up':'down')+'">'+
      '<div class="kpi-label">'+it.label+'</div>'+
      '<div class="kpi-value num '+cls+'">'+it.fmt(val)+'</div>'+
      '<div class="kpi-compare">'+
        '<span><i class="dot red"></i>无Jev '+it.fmt(it.no)+'</span>'+
        '<span><i class="dot blue"></i>有Jev '+it.fmt(it.yes)+'</span>'+
      '</div></div>';
  }).join('');
}

    ['胜率',fmtPct(mNo['胜率']),fmtPct(mYes['胜率']),mNo['胜率']>mYes['胜率']?'no':'yes'],
    ['盈亏比',mNo['盈亏比'].toFixed(2),mYes['盈亏比'].toFixed(2),mNo['盈亏比']>mYes['盈亏比']?'no':'yes'],
    ['交易次数',Math.round(mNo['交易次数']),Math.round(mYes['交易次数']),null],
  ];
  const tbody = document.querySelector('#compareTable tbody');
  tbody.innerHTML = rows.map(r=>
    '<tr><td>'+r[0]+'</td>'+
    '<td class="num'+(r[3]==='no'?' better':'')+'">'+r[1]+'</td>'+
    '<td class="num'+(r[3]==='yes'?' better':'')+'">'+r[2]+'</td></tr>'
  ).join('');
}

// ===== 交易明细表 =====
function renderTradeTable(){
  let trades = [];
  if(currentMode==='compare'||currentMode==='no_jev'){
    DATA.trades.no_jev.forEach(t=>trades.push({...t,mode:'无Jev'}));
  }
  if(currentMode==='compare'||currentMode==='with_jev'){
    DATA.trades.with_jev.forEach(t=>trades.push({...t,mode:'有Jev'}));
  }
  trades.sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('tradeTag').textContent = currentMode==='compare'?'全部交易 ('+trades.length+'笔)':(currentMode==='no_jev'?'无Jev过滤':'有Jev过滤');
  const tbody = document.querySelector('#tradeTable tbody');
  if(trades.length===0){tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--text3)">无交易记录</td></tr>';return}
  tbody.innerHTML = trades.map(t=>
    '<tr><td class="num">'+t.date+'</td>'+
    '<td>'+t.mode+'</td>'+
    '<td class="'+(t.action==='buy'?'tag-buy':'tag-sell')+'">'+(t.action==='buy'?'买入':'卖出')+'</td>'+
    '<td class="num">'+fmtNum(t.price)+'</td>'+
    '<td class="num">'+t.shares+'</td>'+
    '<td class="num">'+fmtNum(t.amount)+'</td>'+
    '<td class="num '+(t.pnl>0?'pnl-pos':t.pnl<0?'pnl-neg':'')+'">'+(t.pnl!==null?fmtMoney(t.pnl):'-')+'</td>'+
    '<td style="color:var(--text3);font-size:.75rem">'+t.reason+'</td></tr>'
  ).join('');
}

// ===== 净值曲线图 =====
function renderEquityChart(){
  const el = document.getElementById('equityChart');
  if(equityChart) equityChart.dispose();
  equityChart = echarts.init(el);
  const dates = DATA.equity.no_jev.map(d=>d[0]);
  let series = [
    {name:'无Jev过滤',type:'line',data:DATA.equity.no_jev.map(d=>d[1]),smooth:true,symbol:'none',
     lineStyle:{width:2,color:'#ff4d6a'},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(255,77,106,.15)'},{offset:1,color:'rgba(255,77,106,0)'}]}}},
    {name:'有Jev过滤',type:'line',data:DATA.equity.with_jev.map(d=>d[1]),smooth:true,symbol:'none',
     lineStyle:{width:2,color:'#4da6ff'},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(77,166,255,.15)'},{offset:1,color:'rgba(77,166,255,0)'}]}}},
    {name:'基准(买入持有)',type:'line',data:DATA.equity.benchmark.map(d=>d[1]),smooth:true,symbol:'none',
     lineStyle:{width:1.5,color:'#5c6478',type:'dashed'}},
  ];
  if(currentMode==='no_jev') series = [series[0],series[2]];
  if(currentMode==='with_jev') series = [series[1],series[2]];
  equityChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:'#1c2238',borderColor:'#252b45',textStyle:{color:'#e4e8f0'},
      formatter:function(p){let s=p[0].axisValue+'<br/>';p.forEach(i=>{s+=i.marker+i.seriesName+': <b>'+i.value[1].toFixed(2)+'</b><br/>'});return s}},
    legend:{data:series.map(s=>s.name),textStyle:{color:'#8b93a7'},top:0,right:10},
    grid:{left:50,right:20,top:40,bottom:30},
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#252b45'}},axisLabel:{color:'#5c6478',fontSize:11}},
    yAxis:{type:'value',scale:true,axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(37,43,69,.5)'}},axisLabel:{color:'#5c6478',fontSize:11,formatter:'{value}'}},
    series:series
  });
}

// ===== 回撤图 =====
function renderDrawdownChart(){
  const el = document.getElementById('drawdownChart');
  if(drawdownChart) drawdownChart.dispose();
  drawdownChart = echarts.init(el);
  const dates = DATA.drawdown.no_jev.map(d=>d[0]);
  let series = [
    {name:'无Jev回撤',type:'line',data:DATA.drawdown.no_jev.map(d=>d[1]),smooth:true,symbol:'none',
     lineStyle:{width:1.5,color:'#ff4d6a'},areaStyle:{color:'rgba(255,77,106,.2)'}},
    {name:'有Jev回撤',type:'line',data:DATA.drawdown.with_jev.map(d=>d[1]),smooth:true,symbol:'none',
     lineStyle:{width:1.5,color:'#4da6ff'},areaStyle:{color:'rgba(77,166,255,.2)'}},
  ];
  if(currentMode==='no_jev') series=[series[0]];
  if(currentMode==='with_jev') series=[series[1]];
  drawdownChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:'#1c2238',borderColor:'#252b45',textStyle:{color:'#e4e8f0'},
      formatter:function(p){let s=p[0].axisValue+'<br/>';p.forEach(i=>{s+=i.marker+i.seriesName+': <b>'+i.value[1].toFixed(2)+'%</b><br/>'});return s}},
    legend:{data:series.map(s=>s.name),textStyle:{color:'#8b93a7'},top:0,right:10},
    grid:{left:50,right:20,top:40,bottom:30},
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#252b45'}},axisLabel:{color:'#5c6478',fontSize:11}},
    yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(37,43,69,.5)'}},axisLabel:{color:'#5c6478',fontSize:11,formatter:'{value}%'}},
    series:series
  });
}

// ===== K线图 =====
function renderKlineChart(){
  const el = document.getElementById('klineChart');
  if(klineChart) klineChart.dispose();
  klineChart = echarts.init(el);
  const mode = currentMode==='with_jev'?'with_jev':'no_jev';
  const tag = mode==='with_jev'?'有Jev过滤':'无Jev过滤';
  document.getElementById('klineTag').textContent = tag;
  const mk = DATA.markers[mode];
  klineChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'#1c2238',borderColor:'#252b45',textStyle:{color:'#e4e8f0'}},
    grid:{left:55,right:20,top:20,bottom:50},
    xAxis:{type:'category',data:DATA.kline.map(d=>d[0]),axisLine:{lineStyle:{color:'#252b45'}},axisLabel:{color:'#5c6478',fontSize:10}},
    yAxis:{scale:true,axisLine:{show:false},splitLine:{lineStyle:{color:'rgba(37,43,69,.5)'}},axisLabel:{color:'#5c6478',fontSize:11}},
    dataZoom:[{type:'inside',start:0,end:100},{type:'slider',height:18,bottom:5,borderColor:'#252b45',textStyle:{color:'#5c6478'},fillerColor:'rgba(77,166,255,.15)',handleStyle:{color:'#4da6ff'}}],
    series:[
      {name:'K线',type:'candlestick',data:DATA.kline.map(d=>[d[1],d[2],d[3],d[4]]),
       itemStyle:{color:'#00d4aa',color0:'#ff4d6a',borderColor:'#00d4aa',borderColor0:'#ff4d6a'}},
      {name:'买入',type:'scatter',data:mk.buys.map(p=>[p[0],p[1]]),symbol:'triangle',symbolSize:12,
       itemStyle:{color:'#00d4aa'},label:{show:true,formatter:'B',position:'bottom',color:'#00d4aa',fontSize:10,fontWeight:'bold'}},
      {name:'卖出',type:'scatter',data:mk.sells.map(p=>[p[0],p[1]]),symbol:'triangle',symbolSize:12,symbolRotate:180,
       itemStyle:{color:'#ff4d6a'},label:{show:true,formatter:'S',position:'top',color:'#ff4d6a',fontSize:10,fontWeight:'bold'}},
    ]
  });
}

// ===== 模式切换 =====
function switchMode(mode){
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&mode==='compare')||(i===1&&mode==='no_jev')||(i===2&&mode==='with_jev'));
  });
  renderKPI();
  renderEquityChart();
  renderDrawdownChart();
  renderKlineChart();
  renderTradeTable();
}

// ===== 响应式 =====
window.addEventListener('resize',()=>{
  [equityChart,drawdownChart,klineChart].forEach(c=>c&&c.resize());
});

// ===== 启动 =====
renderKPI();
renderCompareTable();
renderTradeTable();
renderEquityChart();
renderDrawdownChart();
renderKlineChart();
</script>
</body>
</html>
